name: Build and push images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_fedora:
        description: Also build and push the Fedora base image
        type: boolean
        default: false
      fluxer_only:
        description: Build only fluxer-aio (skip the debian -> wine -> asa chain)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed images
        id: changes
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@v3
        with:
          # 'every': a file counts only if it matches ALL patterns of a filter,
          # so the '!**/*.md' lines exclude docs. README/audit edits never rebuild.
          predicate-quantifier: 'every'
          filters: |
            debian:
              - 'images/systems/debian-base/**'
              - '!**/*.md'
            fedora:
              - 'images/systems/fedora-base/**'
              - '!**/*.md'
            wine:
              - 'images/systems/wine-base/**'
              - '!**/*.md'
            asa:
              - 'images/games/asa-docker/**'
              - '!**/*.md'
            fluxer:
              - 'images/apps/fluxer-aio/**'
              - '!**/*.md'
            workflow:
              - '.github/workflows/build-images.yml'

      # Rollback tags: every build is also pushed as <date> and sha-<short>, so
      # the Unraid template can be pinned back to a known-good image.
      - name: Compute rollback tags
        id: tags
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Keep the image that is about to be replaced as :trixie-previous (registry-side
      # copy, nothing is downloaded). Gives a one-step rollback target.
      - name: Keep current Debian base as :trixie-previous
        if: ((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && !inputs.fluxer_only) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.workflow == 'true'
        env:
          SRC: ${{ secrets.DOCKERHUB_USERNAME }}/debian-slim-baseimage:trixie-latest
          DST: ${{ secrets.DOCKERHUB_USERNAME }}/debian-slim-baseimage:trixie-previous
        run: |
          if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$DST" "$SRC"
          else
            echo "::notice::$SRC does not exist yet, nothing to keep"
          fi

      - name: Build and push Debian base
        if: ((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && !inputs.fluxer_only) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.workflow == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/systems/debian-base
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/debian-slim-baseimage:trixie-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/debian-slim-baseimage:trixie-${{ steps.tags.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/debian-slim-baseimage:trixie-${{ steps.tags.outputs.sha }}

      # Keep the image that is about to be replaced as :previous (registry-side
      # copy, nothing is downloaded). Gives a one-step rollback target.
      - name: Keep current Fedora base as :previous
        if: steps.changes.outputs.fedora == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_fedora)
        env:
          SRC: ${{ secrets.DOCKERHUB_USERNAME }}/fedora-baseimage:latest
          DST: ${{ secrets.DOCKERHUB_USERNAME }}/fedora-baseimage:previous
        run: |
          if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$DST" "$SRC"
          else
            echo "::notice::$SRC does not exist yet, nothing to keep"
          fi

      - name: Build and push Fedora base
        if: steps.changes.outputs.fedora == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_fedora)
        uses: docker/build-push-action@v6
        with:
          context: images/systems/fedora-base
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fedora-baseimage:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fedora-baseimage:${{ steps.tags.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fedora-baseimage:${{ steps.tags.outputs.sha }}

      # Keep the image that is about to be replaced as :previous (registry-side
      # copy, nothing is downloaded). Gives a one-step rollback target.
      - name: Keep current Wine base as :previous
        if: ((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && !inputs.fluxer_only) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.wine == 'true' || steps.changes.outputs.workflow == 'true'
        env:
          SRC: ${{ secrets.DOCKERHUB_USERNAME }}/wine-baseimage:latest
          DST: ${{ secrets.DOCKERHUB_USERNAME }}/wine-baseimage:previous
        run: |
          if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$DST" "$SRC"
          else
            echo "::notice::$SRC does not exist yet, nothing to keep"
          fi

      - name: Build and push Wine base
        if: ((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && !inputs.fluxer_only) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.wine == 'true' || steps.changes.outputs.workflow == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/systems/wine-base
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-baseimage:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-baseimage:${{ steps.tags.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-baseimage:${{ steps.tags.outputs.sha }}

      # Keep the image that is about to be replaced as :previous (registry-side
      # copy, nothing is downloaded). Gives a one-step rollback target.
      - name: Keep current ASA as :previous
        if: ((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && !inputs.fluxer_only) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.wine == 'true' || steps.changes.outputs.asa == 'true' || steps.changes.outputs.workflow == 'true'
        env:
          SRC: ${{ secrets.DOCKERHUB_USERNAME }}/asa-wine:latest
          DST: ${{ secrets.DOCKERHUB_USERNAME }}/asa-wine:previous
        run: |
          if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$DST" "$SRC"
          else
            echo "::notice::$SRC does not exist yet, nothing to keep"
          fi

      - name: Build and push ASA
        if: ((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && !inputs.fluxer_only) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.wine == 'true' || steps.changes.outputs.asa == 'true' || steps.changes.outputs.workflow == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/games/asa-docker
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/asa-wine:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/asa-wine:${{ steps.tags.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/asa-wine:${{ steps.tags.outputs.sha }}

      # fluxer-aio depends only on the Debian base (not on Wine). It is rebuilt
      # with the Debian base, on its own changes, on workflow edits, and on
      # tag/manual runs (also when fluxer_only is ticked).
      - name: Keep current fluxer-aio as :previous
        if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.fluxer == 'true' || steps.changes.outputs.workflow == 'true'
        env:
          SRC: ${{ secrets.DOCKERHUB_USERNAME }}/fluxer-aio:latest
          DST: ${{ secrets.DOCKERHUB_USERNAME }}/fluxer-aio:previous
        run: |
          if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$DST" "$SRC"
          else
            echo "::notice::$SRC does not exist yet, nothing to keep"
          fi

      - name: Build and push fluxer-aio
        if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) || steps.changes.outputs.debian == 'true' || steps.changes.outputs.fluxer == 'true' || steps.changes.outputs.workflow == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/apps/fluxer-aio
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fluxer-aio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fluxer-aio:${{ steps.tags.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fluxer-aio:${{ steps.tags.outputs.sha }}
