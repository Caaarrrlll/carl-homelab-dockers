name: Build and push images

# Which images are built is decided by .github/scripts/plan-builds.py from the
# list in .github/images.json (ROADMAP item 16):
#   push      images whose folder changed (non-.md files) + everything built
#             on them; a change to the CI files themselves = all non-opt-in
#   tag v*    all non-opt-in images
#   schedule  all non-opt-in images (monthly rebuild, 2nd of the month)
#   manual    the images named in "images" (default: all) + everything built
#             on them; "dry_run" only shows the plan
# Images are built level by level (parents first: Debian, then Wine and
# fluxer-aio, then ASA); images on the same level build in parallel. Every
# image keeps the replaced latest as :previous and is pushed as latest plus
# YYYY-MM-DD and sha-<commit> tags (see .github/actions/build-image).
# Rollback: the replaced images are kept as :previous (Retag image workflow).

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Monthly full rebuild (2nd of the month, 04:23 UTC): picks up Debian point
  # releases and security fixes for every image built on Debian.
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch:
    inputs:
      images:
        description: >-
          Images to build, comma separated (e.g. fluxer-aio or asa-wine), or "all".
          Images built on them are rebuilt too. Opt-in images (fedora-base) only when named.
        type: string
        default: all
      dry_run:
        description: Only show the build plan, build nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      level0: ${{ steps.plan.outputs.level0 }}
      level1: ${{ steps.plan.outputs.level1 }}
      level2: ${{ steps.plan.outputs.level2 }}
    steps:
      - name: Checkout (full history, for the changed-files diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan the build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          IMAGES: ${{ inputs.images }}
        run: python3 .github/scripts/plan-builds.py

  # One job per dependency level. A level runs when it has images, the plan
  # is not a dry run, and no earlier level failed (skipped levels are fine).
  build-level-0:
    needs: plan
    if: needs.plan.outputs.level0 != '[]' && !inputs.dry_run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.level0) }}
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-image
        with:
          context: ${{ matrix.context }}
          image: ${{ matrix.image }}
          tag_prefix: ${{ matrix.tag_prefix }}
          namespace: ${{ secrets.DOCKERHUB_USERNAME }}

  build-level-1:
    needs: [plan, build-level-0]
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.build-level-0.result != 'failure'
      && needs.build-level-0.result != 'cancelled'
      && needs.plan.outputs.level1 != '[]'
      && !inputs.dry_run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.level1) }}
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-image
        with:
          context: ${{ matrix.context }}
          image: ${{ matrix.image }}
          tag_prefix: ${{ matrix.tag_prefix }}
          namespace: ${{ secrets.DOCKERHUB_USERNAME }}

  build-level-2:
    needs: [plan, build-level-0, build-level-1]
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.build-level-0.result != 'failure'
      && needs.build-level-0.result != 'cancelled'
      && needs.build-level-1.result != 'failure'
      && needs.build-level-1.result != 'cancelled'
      && needs.plan.outputs.level2 != '[]'
      && !inputs.dry_run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.level2) }}
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-image
        with:
          context: ${{ matrix.context }}
          image: ${{ matrix.image }}
          tag_prefix: ${{ matrix.tag_prefix }}
          namespace: ${{ secrets.DOCKERHUB_USERNAME }}
