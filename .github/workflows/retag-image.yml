name: Retag image

# Manual, registry-side retag on Docker Hub (no local Docker needed).
# Typical uses:
#   - Roll back:  image=asa-wine, source_tag=2026-11-17 (or previous), target_tag=latest
#                 then "Force update" the containers in Unraid. The template
#                 can stay on :latest. The next CI build overwrites latest again.
#   - Keep a known-good build: image=asa-wine, source_tag=latest, target_tag=known-good
# Nothing is rebuilt; the target tag simply points at the same image as the source.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to retag
        type: choice
        options:
          - asa-wine
          - fluxer-aio
          - wine-baseimage
          - debian-slim-baseimage
          - fedora-baseimage
        default: asa-wine
      source_tag:
        description: Existing tag to copy from (e.g. previous, 2026-11-17, sha-abc1234; Debian uses trixie-… tags)
        type: string
        required: true
      target_tag:
        description: Tag to create or overwrite (e.g. latest, known-good)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Never retag while an image build is pushing the same tags.
  group: build-images-refs/heads/main
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tags
        env:
          SRC_TAG: ${{ inputs.source_tag }}
          DST_TAG: ${{ inputs.target_tag }}
        run: |
          for t in "$SRC_TAG" "$DST_TAG"; do
            if ! [[ "$t" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid tag: '$t'"
              exit 1
            fi
          done
          if [ "$SRC_TAG" = "$DST_TAG" ]; then
            echo "::error::Source and target tag are the same"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag
        env:
          SRC: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:${{ inputs.source_tag }}
          DST: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:${{ inputs.target_tag }}
        run: |
          docker buildx imagetools inspect "$SRC" > /dev/null
          docker buildx imagetools create -t "$DST" "$SRC"
          echo "### Retagged" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SRC\` → \`$DST\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$DST"
